name: aquasys
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.0.0
  sqflite: ^2.3.2+1
  cupertino_icons: ^1.0.8
  delightful_toast: ^1.1.0
  http: ^1.3.0
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  flutter_dotenv: ^5.2.1

dev_dependencies:

  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
